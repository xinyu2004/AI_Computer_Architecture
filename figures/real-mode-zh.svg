<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1470" viewBox="0 0 880 1470">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1e3a8a"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "Noto Sans CJK TC", sans-serif; fill: #1c1917; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #44403c; }
    .chg { fill: #b91c1c; font-weight: 700; }
    .box { fill: #f5f5f4; stroke: #44403c; }
    .rom { fill: #e7e5e4; stroke: #44403c; }
    .hit { fill: #fee2e2; stroke: #b91c1c; }
    .arr { stroke: #1e3a8a; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>
  <g class="frame" id="f0">
    <text class="h" x="24" y="28">帧 1　上电后，实模式只看见 0～1MB</text>
    <text x="24" y="54">每一对是段:偏移。段左移 4 位，加上这一对自己的偏移。</text>
    <rect class="box" x="24" y="72" width="832" height="44" rx="6"/>
    <text x="40" y="98">0x00000–0x003FF　中断向量表。BIOS 上电时填好。int 0x13 的入口在第 0x13 项。</text>
    <rect class="hit" x="24" y="124" width="832" height="44" rx="6"/>
    <text x="40" y="150">0x7C00 来自 CS:IP = 0000:7C00。0 左移 4 位，加上 IP 0x7C00。</text>
    <rect class="box" x="24" y="176" width="832" height="44" rx="6"/>
    <text x="40" y="202">0x10000　此时是空的 RAM。稍后 ES:BX = 1000:0000 会得到这里。</text>
    <rect class="box" x="24" y="228" width="832" height="44" rx="6"/>
    <text x="40" y="254">0x90000、0x90200　此时是空的。ES:DI 和 ES:BX 稍后写到这里。</text>
    <rect class="rom" x="24" y="280" width="832" height="44" rx="6"/>
    <text x="40" y="306">0xF0000–0xFFFFF　BIOS 所在的 ROM。CPU 复位后先执行 BIOS，BIOS 再去读磁盘。</text>
    <text class="s" x="24" y="348">示意，不按比例。红色是这一步新写成的地址。A20 这时还关着。</text>
  </g>
  <g class="frame" id="f1" transform="translate(0,390)">
    <text class="h" x="24" y="28">帧 2　磁盘第 1 扇区进 RAM。写入地址来自 CS:IP</text>
    <rect class="box" x="24" y="48" width="250" height="88" rx="6"/>
    <text x="149" y="80" text-anchor="middle">启动盘第 1 扇区</text>
    <text class="s" x="149" y="102" text-anchor="middle">512 字节，末尾 0xAA55</text>
    <line class="arr" x1="274" y1="92" x2="348" y2="92"/>
    <rect class="hit" x="352" y="48" width="504" height="88" rx="6"/>
    <text x="604" y="74" text-anchor="middle">CS:IP = 0000:7C00</text>
    <text class="chg" x="604" y="98" text-anchor="middle">0 &lt;&lt; 4 + 0x7C00 = 0x7C00</text>
    <text class="s" x="604" y="118" text-anchor="middle">这时 CS 是 0，不是 0x07C0</text>
    <text x="24" y="164">读盘的是 ROM 里的 BIOS。bootsect.s 还在磁盘上。</text>
    <text x="24" y="188">BIOS 跳到这个 CS:IP。F5 停在 bootsect.s 的 start。</text>
    <text x="24" y="212">后面的 int 0x13 仍由 BIOS 提供。目的地址改由 ES:BX 给出。</text>
  </g>
  <g class="frame" id="f2" transform="translate(0,680)">
    <text class="h" x="24" y="28">帧 3　先在 RAM 里搬家，再从磁盘读进 RAM</text>
    <rect class="box" x="24" y="46" width="280" height="78" rx="6"/>
    <text x="164" y="70" text-anchor="middle">DS:SI = 07C0:0000</text>
    <text class="chg" x="164" y="92" text-anchor="middle">0x07C0 &lt;&lt; 4 + 0</text>
    <text class="chg" x="164" y="110" text-anchor="middle">= 0x7C00</text>
    <line class="arr" x1="304" y1="85" x2="368" y2="85"/>
    <rect class="hit" x="372" y="46" width="484" height="78" rx="6"/>
    <text x="614" y="70" text-anchor="middle">ES:DI = 9000:0000</text>
    <text class="chg" x="614" y="92" text-anchor="middle">0x9000 &lt;&lt; 4 + 0 = 0x90000</text>
    <text class="s" x="614" y="110" text-anchor="middle">rep movsw，256 个字。人还在 0x7C00</text>
    <rect class="box" x="24" y="136" width="280" height="78" rx="6"/>
    <text x="164" y="166" text-anchor="middle">磁盘上的 setup</text>
    <text class="s" x="164" y="188" text-anchor="middle">4 个扇区，int 0x13</text>
    <line class="arr" x1="304" y1="175" x2="368" y2="175"/>
    <rect class="hit" x="372" y="136" width="484" height="78" rx="6"/>
    <text x="614" y="160" text-anchor="middle">ES:BX = 9000:0200</text>
    <text class="chg" x="614" y="182" text-anchor="middle">0x9000 &lt;&lt; 4 + 0x200 = 0x90200</text>
    <text class="s" x="614" y="200" text-anchor="middle">setup.s。偏移是 BX，不是 DI</text>
    <rect class="box" x="24" y="226" width="280" height="78" rx="6"/>
    <text x="164" y="256" text-anchor="middle">磁盘上的 system</text>
    <text class="s" x="164" y="278" text-anchor="middle">read_it，还是 int 0x13</text>
    <line class="arr" x1="304" y1="265" x2="368" y2="265"/>
    <rect class="hit" x="372" y="226" width="484" height="78" rx="6"/>
    <text x="614" y="250" text-anchor="middle">ES:BX = 1000:0000</text>
    <text class="chg" x="614" y="272" text-anchor="middle">0x1000 &lt;&lt; 4 + 0 = 0x10000</text>
    <text class="s" x="614" y="290" text-anchor="middle">读到段 0x4000 之前，线性 0x40000</text>
    <text x="24" y="328">go 之后栈是 SS:SP = 9000:FF00。</text>
    <text class="chg" x="24" y="352">0x9000 &lt;&lt; 4 + 0xFF00 = 0x9FF00</text>
    <text x="24" y="376">第一支是 RAM 里的搬家。后两支才是磁盘进 RAM，人已经在 0x90000。</text>
    <text x="24" y="400">然后 ljmp 到 CS:IP = 9020:0000，进入 setup.s。0x9020 &lt;&lt; 4 + 0 = 0x90200。</text>
  </g>
  <g class="frame" id="f3" transform="translate(0,1110)">
    <text class="h" x="24" y="28">帧 4　setup 把 system 从 0x10000 搬到物理地址 0</text>
    <rect class="box" x="24" y="46" width="280" height="78" rx="6"/>
    <text x="164" y="70" text-anchor="middle">DS:SI = 1000:0000</text>
    <text class="chg" x="164" y="94" text-anchor="middle">0x1000 &lt;&lt; 4 + 0 = 0x10000</text>
    <line class="arr" x1="304" y1="85" x2="368" y2="85"/>
    <rect class="hit" x="372" y="46" width="484" height="78" rx="6"/>
    <text x="614" y="70" text-anchor="middle">ES:DI = 0000:0000</text>
    <text class="chg" x="614" y="94" text-anchor="middle">0 &lt;&lt; 4 + 0 = 0</text>
    <text class="s" x="614" y="112" text-anchor="middle">第一次 rep movsw，64KB</text>
    <text x="24" y="150">下一次 DS 和 ES 都加 0x1000。源段加到 0x9000 就停，0x90200 的 setup 留着。</text>
    <text x="24" y="174">0x20000 搬到 0x10000，0x30000 搬到 0x20000。</text>
    <text x="24" y="206">搬完，setup 还做四件事。写成的寄存器在保护模式那张图上。</text>
    <text x="40" y="230">lgdt gdt_48。字节 0–1 界限 0x800，字节 2–3 是 512+gdt，字节 4–5 是 0x0009。</text>
    <text x="40" y="254">A20：端口 0x64 写 0xD1，端口 0x60 写 0xDF。</text>
    <text x="40" y="278">8259：主片向量基址 0x20，从片 0x28。</text>
    <text x="40" y="302">lmsw 写 CR0 的低 16 位，接着 ljmp $8,$0。</text>
    <text class="s" x="24" y="330">RV32、ARMv7、AArch64 没有这张图。QEMU 把镜像放在链接地址上，直接进入 _start。</text>
  </g>
</svg>
