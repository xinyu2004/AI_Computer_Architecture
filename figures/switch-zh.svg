<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580">

  <style>
    text { font-family: "Noto Sans CJK SC", "Noto Sans CJK TC", sans-serif; fill: #1c1917; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #44403c; }
    .chg { fill: #b91c1c; font-weight: 700; }
    .box { fill: #f5f5f4; stroke: #44403c; }
    .arr { stroke: #1e3a8a; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>

  <g class="frame" id="f0">
    <text class="h" x="24" y="28">帧 1　80386 用 ljmp 跳到下一个任务的 TSS 选择子</text>
    <rect class="box" x="24" y="48" width="410" height="200" rx="6"/>
    <text x="40" y="74">CPU 写入旧任务的 TSS</text>
    <text class="chg" x="40" y="102">CR3、EIP、EFLAGS</text>
    <text class="chg" x="40" y="126">EAX ECX EDX EBX ESP EBP ESI EDI</text>
    <text class="chg" x="40" y="150">ES CS SS DS FS GS</text>
    <text x="40" y="178">LDT 选择子也在这份 TSS 里</text>
    <text class="s" x="40" y="206">ljmp 后面的指令等换回来才跑</text>
    <rect class="box" x="446" y="48" width="410" height="200" rx="6"/>
    <text x="462" y="74">CPU 从新任务的 TSS 装入</text>
    <text class="chg" x="462" y="102">CR3、EIP、EFLAGS</text>
    <text class="chg" x="462" y="126">同一组通用寄存器和段寄存器</text>
    <text class="chg" x="462" y="150">LDT</text>
    <text x="462" y="178">接着执行新 TSS 里保存的 EIP</text>
    <text class="s" x="462" y="222">这是跳转，不嵌套任务。NT 不因此置 1</text>
  </g>
  <g class="frame" id="f1" transform="translate(0,280)">
    <text class="h" x="24" y="28">帧 2　另外三台把被调用者保存的寄存器写进自己的块</text>
    <rect class="box" x="24" y="48" width="832" height="72" rx="6"/>
    <text x="40" y="72">RV32　swtch(old, next)，a0 是旧块，a1 是新块</text>
    <text class="chg" x="40" y="98">ra、sp、s0–s11。ret 跳到装入的 ra</text>
    <rect class="box" x="24" y="132" width="832" height="72" rx="6"/>
    <text x="40" y="156">ARMv7　r0 是旧块，r1 是新块。人留在 SVC</text>
    <text class="chg" x="40" y="182">r4–r11、lr、sp。bx lr 跳到装入的 lr</text>
    <rect class="box" x="24" y="216" width="832" height="72" rx="6"/>
    <text x="40" y="240">AArch64　x0 是旧块，x1 是新块。人留在 EL1</text>
    <text class="chg" x="40" y="266">x19–x30、sp。ret 跳到装入的 x30</text>
  </g>

</svg>
