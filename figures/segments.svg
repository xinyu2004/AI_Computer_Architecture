<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860">

  <style>
    text { font-family: ui-sans-serif, sans-serif; fill: #1c1917; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #44403c; }
    .chg { fill: #b91c1c; font-weight: 700; }
    .box { fill: #f5f5f4; stroke: #44403c; }
    .rom { fill: #e7e5e4; stroke: #44403c; }
    .arr { stroke: #1e3a8a; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>

  <g class="frame" id="f0">
    <text class="h" x="24" y="28">lgdt. The whole gdt_48. Red is what lands in GDTR</text>
    <text x="24" y="52">DS = 0x9020. The 6 bytes sit at linear 0x90200 plus the offset of gdt_48.</text>
    <rect class="box" x="24" y="68" width="270" height="72" rx="6"/>
    <text x="159" y="94" text-anchor="middle">bytes 0-1</text>
    <text x="159" y="116" text-anchor="middle">limit 0x800</text>
    <rect class="box" x="306" y="68" width="270" height="72" rx="6"/>
    <text x="441" y="94" text-anchor="middle">bytes 2-3  base [15:0]</text>
    <text x="441" y="116" text-anchor="middle">512+gdt</text>
    <rect class="box" x="588" y="68" width="268" height="72" rx="6"/>
    <text x="722" y="94" text-anchor="middle">bytes 4-5  base [31:16]</text>
    <text x="722" y="116" text-anchor="middle">0x0009</text>
    <text x="24" y="164">The base is 0x90000 + 512 + the offset of gdt, the linear address of label gdt.</text>
    <rect class="box" x="24" y="180" width="832" height="64" rx="6"/>
    <text class="chg" x="40" y="206">GDTR.limit = 0x800</text>
    <text class="chg" x="40" y="228">GDTR.base = linear address of label gdt</text>
    <text x="24" y="270">CS:IP = 9020:this lgdt</text>
    <text x="300" y="270">DS = 0x9020</text>
    <text x="480" y="270">CR0.PE = 0</text>
    <text x="24" y="300">The table at label gdt:</text>
    <text x="40" y="324">index 0  null descriptor</text>
    <text x="40" y="348">selector 8  code  base 0  limit 8MB  DPL 0  type 0x9A</text>
    <text x="40" y="372">selector 0x10  data  base 0  limit 8MB  DPL 0  type 0x92</text>
  </g>
  <g class="frame" id="f1" transform="translate(0,400)">
    <text class="h" x="24" y="28">lmsw. The whole CR0. Red is the low 16 bits just written</text>
    <text x="24" y="54">AX = 1. lmsw writes AX into the low 16 bits, so those bits are 0x0001.</text>
    <rect class="box" x="24" y="72" width="100" height="52" rx="6"/>
    <text class="chg" x="74" y="94" text-anchor="middle">PE = 1</text>
    <text class="s" x="74" y="112" text-anchor="middle">bit 0</text>
    <rect class="box" x="132" y="72" width="100" height="52" rx="6"/>
    <text class="chg" x="182" y="94" text-anchor="middle">MP = 0</text>
    <text class="s" x="182" y="112" text-anchor="middle">bit 1</text>
    <rect class="box" x="240" y="72" width="100" height="52" rx="6"/>
    <text class="chg" x="290" y="94" text-anchor="middle">EM = 0</text>
    <text class="s" x="290" y="112" text-anchor="middle">bit 2</text>
    <rect class="box" x="348" y="72" width="100" height="52" rx="6"/>
    <text class="chg" x="398" y="94" text-anchor="middle">TS = 0</text>
    <text class="s" x="398" y="112" text-anchor="middle">bit 3</text>
    <rect class="box" x="456" y="72" width="100" height="52" rx="6"/>
    <text class="chg" x="506" y="94" text-anchor="middle">ET = 0</text>
    <text class="s" x="506" y="112" text-anchor="middle">bit 4</text>
    <rect class="box" x="564" y="72" width="108" height="52" rx="6"/>
    <text class="chg" x="618" y="103" text-anchor="middle">5-15 = 0</text>
    <rect class="box" x="680" y="72" width="110" height="52" rx="6"/>
    <text x="735" y="103" text-anchor="middle">16-30 = 0</text>
    <rect class="box" x="798" y="72" width="58" height="52" rx="6"/>
    <text x="827" y="103" text-anchor="middle">PG=0</text>
    <text x="24" y="156">lmsw cannot reach the high 16 bits, so PG is still 0. CS is still 0x9020, hidden base 0x90200.</text>
    <text x="24" y="184">With a coprocessor, head.s later writes MP = 1. With none, it writes MP = 0 and EM = 1.</text>
  </g>
  <g class="frame" id="f2" transform="translate(0,620)">
    <text class="h" x="24" y="28">ljmp $8,$0. The whole hidden CS descriptor. Red is what this jump loads</text>
    <rect class="box" x="24" y="48" width="420" height="168" rx="6"/>
    <text x="40" y="74">CS</text>
    <text class="chg" x="40" y="100">selector = 8</text>
    <text class="chg" x="40" y="124">hidden base = 0</text>
    <text class="chg" x="40" y="148">limit = 8MB    DPL = 0    type 0x9A</text>
    <text class="chg" x="40" y="172">IP = 0</text>
    <text class="s" x="40" y="196">index is the top 13 bits, RPL the low 2</text>
    <rect class="box" x="460" y="48" width="396" height="168" rx="6"/>
    <text x="476" y="74">GDTR and CR0</text>
    <text x="476" y="102">GDTR.limit = 0x800</text>
    <text x="476" y="126">GDTR.base = label gdt</text>
    <text x="476" y="150">CR0.PE = 1</text>
    <text x="476" y="174">CR0.PG = 0</text>
    <text class="s" x="476" y="198">The far jump also drains prefetch</text>
  </g>

</svg>
