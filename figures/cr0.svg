<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240">
  <style>
    text { font-family: ui-sans-serif, sans-serif; fill: #1c1917; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #44403c; }
    .chg { fill: #b91c1c; font-weight: 700; }
    .box { fill: #f5f5f4; stroke: #44403c; }
    .use { fill: #dbeafe; stroke: #1e3a8a; }
    .on { fill: #fee2e2; stroke: #b91c1c; }
  </style>

  <text class="h" x="24" y="28">CR0 after paging is on, with a coprocessor. Red marks bits this kernel writes</text>
  <rect class="on" x="24" y="52" width="88" height="64" rx="4"/>
  <text class="chg" x="68" y="78" text-anchor="middle">PE = 1</text>
  <text class="s" x="68" y="100" text-anchor="middle">bit 0</text>
  <rect class="on" x="120" y="52" width="88" height="64" rx="4"/>
  <text class="chg" x="164" y="78" text-anchor="middle">MP = 1</text>
  <text class="s" x="164" y="100" text-anchor="middle">bit 1</text>
  <rect class="on" x="216" y="52" width="88" height="64" rx="4"/>
  <text class="chg" x="260" y="78" text-anchor="middle">EM = 0</text>
  <text class="s" x="260" y="100" text-anchor="middle">bit 2</text>
  <rect class="on" x="312" y="52" width="88" height="64" rx="4"/>
  <text class="chg" x="356" y="78" text-anchor="middle">TS = 0</text>
  <text class="s" x="356" y="100" text-anchor="middle">bit 3</text>
  <rect class="on" x="408" y="52" width="88" height="64" rx="4"/>
  <text class="chg" x="452" y="78" text-anchor="middle">ET = 0</text>
  <text class="s" x="452" y="100" text-anchor="middle">bit 4</text>
  <rect class="box" x="504" y="52" width="200" height="64" rx="4"/>
  <text x="604" y="90" text-anchor="middle">bits 5-30 = 0</text>
  <rect class="on" x="712" y="52" width="144" height="64" rx="4"/>
  <text class="chg" x="784" y="78" text-anchor="middle">PG = 1</text>
  <text class="s" x="784" y="100" text-anchor="middle">bit 31</text>
  <text x="24" y="148">lmsw writes the low 16 bits as 0x0001. head.s then writes MP = 1. setup_paging writes PG = 1.</text>
  <text x="24" y="176">With no coprocessor, MP is written 0 and EM is written 1. Bits 5-30 are reserved on the 386.</text>
  <text class="s" x="24" y="208">Mask 0x80000011 keeps PG, ET, and PE. ET is 0 after lmsw, so the kept value is 0.</text>

</svg>
