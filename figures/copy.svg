<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1e3a8a"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, sans-serif; fill: #1c1917; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #44403c; }
    .chg { fill: #b91c1c; font-weight: 700; }
    .box { fill: #f5f5f4; stroke: #44403c; }
    .arr { stroke: #1e3a8a; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>

  <text class="h" x="24" y="28">One page, 4096 bytes. Red is the destination, and the count that runs down</text>
  <rect class="box" x="24" y="52" width="250" height="64" rx="6"/>
  <text x="149" y="78" text-anchor="middle">80386  ESI = source</text>
  <text class="s" x="149" y="98" text-anchor="middle">DS base is 0</text>
  <line class="arr" x1="274" y1="84" x2="360" y2="84"/>
  <rect class="box" x="364" y="52" width="492" height="64" rx="6"/>
  <text class="chg" x="610" y="78" text-anchor="middle">EDI = destination</text>
  <text class="chg" x="610" y="98" text-anchor="middle">ECX runs from 1024 to 0. rep movsl, cld</text>
  <rect class="box" x="24" y="136" width="250" height="64" rx="6"/>
  <text x="149" y="174" text-anchor="middle">RV32  src</text>
  <line class="arr" x1="274" y1="168" x2="360" y2="168"/>
  <rect class="box" x="364" y="136" width="492" height="64" rx="6"/>
  <text class="chg" x="610" y="162" text-anchor="middle">dst  1024 words of 32 bits</text>
  <text class="s" x="610" y="182" text-anchor="middle">fork copies the user stack page at 0x80000</text>
  <rect class="box" x="24" y="220" width="250" height="64" rx="6"/>
  <text x="149" y="258" text-anchor="middle">ARMv7  src</text>
  <line class="arr" x1="274" y1="252" x2="360" y2="252"/>
  <rect class="box" x="364" y="220" width="492" height="64" rx="6"/>
  <text class="chg" x="610" y="246" text-anchor="middle">dst  1024 words of 32 bits</text>
  <text class="s" x="610" y="266" text-anchor="middle">the same user stack page at 0x80000</text>
  <rect class="box" x="24" y="304" width="250" height="64" rx="6"/>
  <text x="149" y="342" text-anchor="middle">AArch64  src</text>
  <line class="arr" x1="274" y1="336" x2="360" y2="336"/>
  <rect class="box" x="364" y="304" width="492" height="64" rx="6"/>
  <text class="chg" x="610" y="330" text-anchor="middle">dst  512 words of 64 bits</text>
  <text class="s" x="610" y="350" text-anchor="middle">the same user stack page at 0x80000</text>
  <text x="24" y="400">Each copy is 4096 bytes. On the 80386 each movsl moves 4 bytes, 1024 times.</text>
  <text x="24" y="424">The 80386 copy_page breaks copy-on-write. The other three run it from fork.</text>

</svg>
