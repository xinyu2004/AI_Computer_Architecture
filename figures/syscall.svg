<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660">

  <style>
    text { font-family: ui-sans-serif, sans-serif; fill: #1c1917; font-size: 14px; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; fill: #44403c; }
    .chg { fill: #b91c1c; font-weight: 700; }
    .box { fill: #f5f5f4; stroke: #44403c; }
    .arr { stroke: #1e3a8a; stroke-width: 2; fill: none; marker-end: url(#ah); }
  </style>

  <g class="frame" id="f0">
    <text class="h" x="24" y="28">Frame 1. Where the call number sits. Red is the number and the cause</text>
    <rect class="box" x="24" y="48" width="410" height="140" rx="6"/>
    <text x="40" y="74">80386  int $0x80</text>
    <text class="chg" x="40" y="100">EAX = call number</text>
    <text x="40" y="124">EDX, ECX, EBX are the three arguments</text>
    <text x="40" y="148">The return value goes back to EAX</text>
    <text class="s" x="40" y="172">The user wrote EAX before the int. Vector 0x80</text>
    <rect class="box" x="446" y="48" width="410" height="140" rx="6"/>
    <text x="462" y="74">RV32  ecall</text>
    <text class="chg" x="462" y="100">a7 = call number</text>
    <text class="chg" x="462" y="124">scause = 8, bit 31 = 0</text>
    <text x="462" y="148">a0, a1, a2 are arguments. Result in a0</text>
    <text class="s" x="462" y="172">sepc points at this ecall</text>
    <rect class="box" x="24" y="200" width="410" height="140" rx="6"/>
    <text x="40" y="226">ARMv7  svc #0</text>
    <text class="chg" x="40" y="252">r7 = call number</text>
    <text x="40" y="276">Entry is the svc vector. The number is r7</text>
    <text x="40" y="300">r0, r1, r2 are arguments. Result in r0</text>
    <text class="s" x="40" y="324">LR_svc already points at the next instruction</text>
    <rect class="box" x="446" y="200" width="410" height="140" rx="6"/>
    <text x="462" y="226">AArch64  svc #0</text>
    <text class="chg" x="462" y="252">x8 = call number</text>
    <text class="chg" x="462" y="276">ESR_EL1 bits 31-26 = 0x15</text>
    <text x="462" y="300">x0, x1, x2 are arguments. Result in x0</text>
    <text class="s" x="462" y="324">ELR_EL1 already points at the next instruction</text>
  </g>
  <g class="frame" id="f1" transform="translate(0,360)">
    <text class="h" x="24" y="28">Frame 2. The timer cause. Red is the value the hardware writes</text>
    <rect class="box" x="24" y="48" width="832" height="44" rx="6"/>
    <text x="40" y="76">80386  the 8259 delivers IRQ0 as vector</text>
    <text class="chg" x="420" y="76">0x20</text>
    <rect class="box" x="24" y="104" width="832" height="84" rx="6"/>
    <text x="40" y="128">RV32  the whole scause</text>
    <text class="chg" x="230" y="128">0x80000005</text>
    <text x="40" y="152">Bit 31 = 1, low bits = 5. The other bits are 0.</text>
    <text class="s" x="40" y="174">RV64 keeps the interrupt in bit 63: 0x8000000000000005.</text>
    <rect class="box" x="24" y="200" width="410" height="64" rx="6"/>
    <text x="40" y="226">ARMv7  GICC_IAR</text>
    <text class="chg" x="40" y="250">low 10 bits = 30</text>
    <rect class="box" x="446" y="200" width="410" height="64" rx="6"/>
    <text x="462" y="226">AArch64  GICC_IAR</text>
    <text class="chg" x="462" y="250">low 10 bits = 30</text>
  </g>

</svg>
